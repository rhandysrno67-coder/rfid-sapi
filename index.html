<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Livestock Tracking</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #0f172a;
  color: #e2e8f0;
}

/* HEADER */
.header {
  padding: 20px 40px;
  font-size: 20px;
  font-weight: 600;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* MAIN */
.main {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 90vh;
}

/* CARD */
.card {
  background: #1e293b;
  border-radius: 16px;
  padding: 30px;
  width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

/* TITLE */
.title {
  font-size: 22px;
  margin-bottom: 25px;
}

/* DATA */
.row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 14px;
  opacity: 0.8;
}

.value {
  font-weight: 600;
  color: #38bdf8;
}

/* STATUS */
.status {
  margin-top: 25px;
  padding: 14px;
  border-radius: 10px;
  text-align: center;
  font-weight: 600;
  font-size: 16px;
}

.aman {
  background: rgba(34,197,94,0.15);
  color: #22c55e;
}

.bahaya {
  background: rgba(239,68,68,0.15);
  color: #ef4444;
}

.unknown {
  background: rgba(234,179,8,0.15);
  color: #eab308;
}

/* FOOTER */
.footer {
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.5;
  text-align: center;
}
</style>
</head>

<body>

<div class="header">
  Livestock IoT Monitoring System
</div>

<div class="main">
  <div class="card">

    <div class="title">🐄 Cow Tracking Data</div>

    <div class="row">
      <div>ID</div>
      <div class="value" id="id"></div>
    </div>

    <div class="row">
      <div>Location</div>
      <div class="value" id="lokasi"></div>
    </div>

    <div class="row">
      <div>Timestamp</div>
      <div class="value" id="waktu"></div>
    </div>

    <div id="statusBox" class="status"></div>

    <div class="footer">
      ✔ Verified via Blockchain System
    </div>

  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const id = params.get("id") || "-";
const status = params.get("status") || "UNKNOWN";
const lokasi = params.get("lokasi") || "-";

document.getElementById("id").innerText = id;
document.getElementById("lokasi").innerText = lokasi;
document.getElementById("waktu").innerText = new Date().toLocaleString();

const box = document.getElementById("statusBox");

if (status === "AMAN") {
  box.innerText = "STATUS: AMAN";
  box.classList.add("aman");
} else if (status === "BAHAYA") {
  box.innerText = "STATUS: BAHAYA";
  box.classList.add("bahaya");
} else {
  box.innerText = "STATUS: UNKNOWN";
  box.classList.add("unknown");
}
</script>

</body>
</html>
