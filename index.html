<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Sapi</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 50px auto;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #2c3e50;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>🐄 Dashboard Sapi</h2>
    <p><b>ID Sapi:</b> <span id="uid"></span></p>
    <p><b>Status:</b> Sehat</p>
    <p><b>Lokasi:</b> Kandang A</p>
    <p><b>Pakan:</b> Normal</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("uid").innerText = params.get("id");
  </script>
</body>
</html>
