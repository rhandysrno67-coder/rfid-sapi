<!DOCTYPE html>
<html>
<head>
  <title>RFID Livestock Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      width: 350px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .info {
      margin: 10px 0;
      font-size: 16px;
      opacity: 0.9;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .aman {
      background: rgba(34,197,94,0.2);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .bahaya {
      background: rgba(239,68,68,0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .unknown {
      background: rgba(234,179,8,0.2);
      border: 1px solid #eab308;
      color: #eab308;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>🐄 RFID Livestock</h1>

    <div class="info" id="id"></div>
    <div class="info" id="lokasi"></div>
    <div class="info" id="waktu"></div>

    <div id="statusBox" class="status"></div>

  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);

  const id = params.get("id") || "Tidak ada";
  const status = params.get("status") || "UNKNOWN";
  const lokasi = params.get("lokasi") || "Tidak diketahui";

  document.getElementById("id").innerText = "ID Sapi : " + id;
  document.getElementById("lokasi").innerText = "Lokasi : " + lokasi;
  document.getElementById("waktu").innerText = "Waktu : " + new Date().toLocaleString();

  const box = document.getElementById("statusBox");

  if (status === "AMAN") {
    box.innerText = "🟢 AMAN";
    box.classList.add("aman");
  } else if (status === "BAHAYA") {
    box.innerText = "🔴 BAHAYA";
    box.classList.add("bahaya");
  } else {
    box.innerText = "🟡 UNKNOWN";
    box.classList.add("unknown");
  }
</script>

</body>
</html>
